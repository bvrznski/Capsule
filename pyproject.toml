[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "rebuntu-capsule"
version = "0.30.0"
requires-python = ">=3.10"
description = "Deterministic desktop activity and workspace manager"
[project.scripts]
capsulectl = "capsule.interfaces.cli:main"
[tool.setuptools.packages.find]
include = ["capsule*"]
